<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Blog - BlogSphere</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                BlogSphere
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>

        </nav>
    </header>


    <!-- Create Blog -->
    <main class="create-blog-page">

        <div class="create-blog-container">

            <div class="create-blog-header">
                <h1>Create Your Blog</h1>

                <p>
                    Share your ideas and stories with the BlogSphere community.
                </p>
            </div>


            <form id="blogForm">

                <!-- Blog Title -->
                <div class="form-group">
                    <label for="title">Blog Title</label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Enter your blog title"
                        required
                    >
                </div>


                <!-- Category -->
                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Technology">
                            Technology
                        </option>

                        <option value="Programming">
                            Programming
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Career">
                            Career
                        </option>

                        <option value="Lifestyle">
                            Lifestyle
                        </option>

                    </select>
                </div>


                <!-- Image URL -->
                <div class="form-group">
                    <label for="image">Featured Image URL</label>

                    <input
                        type="url"
                        id="image"
                        placeholder="https://example.com/image.jpg"
                    >
                </div>


                <!-- Blog Content -->
                <div class="form-group">
                    <label for="content">Blog Content</label>

                    <textarea
                        id="content"
                        rows="12"
                        placeholder="Write your blog here..."
                        required
                    ></textarea>
                </div>


                <!-- Tags -->
                <div class="form-group">
                    <label for="tags">Tags</label>

                    <input
                        type="text"
                        id="tags"
                        placeholder="javascript, web development, coding"
                    >
                </div>


                <!-- Buttons -->
                <div class="blog-form-buttons">

                    <button
                        type="submit"
                        class="publish-btn">
                        Publish Blog
                    </button>

                    <button
                        type="button"
                        class="draft-btn">
                        Save Draft
                    </button>

                </div>

            </form>

        </div>

    </main>


    <footer>
        <p>© 2026 BlogSphere. All rights reserved.</p>
    </footer>


    <script src="js/main.js"></script>

</body>
</html>
